name: Blink Health
description: Blink Health is a healthcare technology company that operates BlinkRx, a digital
  pharmacy platform connecting patients, prescribers, and pharmaceutical manufacturers to simplify
  prescription access, fulfillment, and affordability. The platform streamlines the path from a
  provider writing a prescription to a patient receiving medication at a transparent price, with
  copay support, home delivery, and manufacturer-sponsored programs. Backed by 8vc, Blink Health
  runs consumer-facing prescription-savings tools and a provider/pharma-facing BlinkRx offering.
  No public developer API program or documentation was found during enrichment; a live undocumented
  API host exists at api.blinkhealth.com.
